name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

jobs:
  test:
    name: gate on tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Install uv
        uses: astral-sh/setup-uv@v6
      - name: Sync project and dev tools
        run: uv sync --locked
      - name: Lint, type check, and test
        run: |
          uv run ruff check src tests
          uv run ruff format --check src tests
          uv run mypy
          uv run pytest

  release:
    name: publish GitHub release
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5
      - name: Install uv
        uses: astral-sh/setup-uv@v6
      - name: Build sdist and wheel
        run: uv build
      - name: Verify version matches the tag
        run: |
          tag="${GITHUB_REF_NAME#v}"
          if ! grep -q "version = \"$tag\"" pyproject.toml; then
            echo "tag $GITHUB_REF_NAME does not match pyproject version" >&2
            exit 1
          fi
      - name: Create the GitHub release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release create "$GITHUB_REF_NAME" dist/* --verify-tag --generate-notes
